# ─────────────────────────────────────────────────────────────────────────────
# Elastic Observability Lab — Docker Compose
#
# Services:
#   elasticsearch   → Single-node Elasticsearch 8.17 (no TLS for local dev)
#   kibana          → Kibana 8.17 connected to Elasticsearch
#   otel-collector  → OpenTelemetry Collector (contrib) — receives OTLP, exports to ES
#   app             → FastAPI demo application
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#   curl http://localhost:8000/health
#   open http://localhost:5601
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Elasticsearch ──────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.19.21}
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=observability-lab
      - discovery.type=single-node
      # Disable security for local development — enable for production
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      # JVM heap — increase if you have more RAM
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # Allow large datasets for demo
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - observability-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # ── Kibana ──────────────────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.19.21}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-}
      # Disable telemetry for demo
      - TELEMETRY_ENABLED=false
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    networks:
      - observability-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ── OpenTelemetry Collector ────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.160.0}
    container_name: otel-collector
    command: ["--config=/etc/otel/otel-config.yml"]
    environment:
      # Passed through to the collector config
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME:-}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:-}
    volumes:
      - ./elastic/otel-config.yml:/etc/otel/otel-config.yml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${OTEL_HTTP_PORT:-4318}:4318"   # OTLP HTTP
      - "8888:8888"                       # Collector internal metrics
    networks:
      - observability-net
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # ── FastAPI Application ────────────────────────────────────────────────────
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    # pull_policy: build tells Docker to always build this image locally
    # and never attempt to pull it from a registry
    pull_policy: build
    image: elastic-observability-demo:latest
    container_name: observability-app
    environment:
      # OTel SDK configuration
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-elastic-observability-demo}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      # Failure simulation — change to "true" to introduce latency
      - SIMULATE_LATENCY=${SIMULATE_LATENCY:-false}
      # Python log level
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8000}:8000"
    networks:
      - observability-net
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  elasticsearch-data:
    driver: local
    name: observability-elasticsearch-data

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  observability-net:
    driver: bridge
    name: observability-net
